<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine's Services | AI Voice Automation</title>

  <style>
    :root {
      --primary: #2563eb;
      --accent: #3b82f6;
      --dark: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --muted: #94a3b8;
      --light: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--dark);
      color: var(--light);
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      padding: 2rem 0;
      border-bottom: 1px solid var(--border);
    }

    /* HERO */
    .hero {
      padding: 5rem 0;
      text-align: center;
    }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      background: linear-gradient(to right, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.25rem;
      color: var(--muted);
      max-width: 650px;
      margin: 0 auto 2rem;
    }

    .cta-button {
      display: inline-block;
      background-color: var(--primary);
      color: #ffffff;
      padding: 1.1rem 2.4rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.1rem;
      border: 2px solid var(--primary);
      transition: all 0.2s ease;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.35);
    }

    .cta-button:hover {
      transform: translateY(-2px);
      background-color: var(--accent);
    }

    .cta-secondary {
      background: transparent;
      border: 2px solid var(--border);
      box-shadow: none;
    }

    .section {
      padding: 4.5rem 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .card {
      background: var(--card);
      padding: 2rem;
      border-radius: 1rem;
      border: 1px solid var(--border);
    }

    .price-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid var(--primary);
      padding: 3rem;
      border-radius: 1rem;
      text-align: center;
      max-width: 520px;
      margin: 0 auto;
      position: relative;
    }

    .badge {
      position: absolute;
      top: -14px;
      right: 20px;
      background: #059669;
      color: #fff;
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: 600;
    }

    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 3rem 0;
      color: #64748b;
      margin-bottom: 90px;
    }

    /* Sticky phone button (bottom-left) */
    .sticky-phone-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background-color: #059669;
      color: white;
      padding: 12px 20px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      z-index: 1500;
      border: 2px solid #047857;
    }

    .sticky-phone-btn:hover {
      transform: scale(1.05);
      background-color: #047857;
    }

    /* 🔒 FORCE VAPI WIDGET TO STAY FIXED (BOTTOM-RIGHT) */
    .vapi-widget,
    .vapi-container,
    .vapi-btn {
      position: fixed !important;
      bottom: 20px !important;
      right: 20px !important;
      z-index: 2000 !important;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.5rem;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container" style="display:flex;align-items:center;">
    <img src="valentinesserviceslogo2.jpg"
         alt="Valentine's Services"
         style="height:130px;width:130px;border-radius:50%;object-fit:cover;border:2px solid #334155;">
  </div>
</header>

<!-- (ALL YOUR SECTIONS REMAIN UNCHANGED) -->

<footer>
  <div class="container">
    <p>&copy; 2024 Valentine's Services · Rock Hill, SC</p>
  </div>
</footer>

<a href="tel:+18039027790" class="sticky-phone-btn">
  <span>📞 Call Us</span>
</a>

<script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag/dist/assets/index.js"></script>
<script>
  window.vapiSDK.run({
    apiKey: "2d50143b-0c3b-4a09-aa1a-faaf09714bc5",
    assistant: "6ac7a447-64bc-4eb6-a38b-1d1ec67bd4ce",
    config: {
      position: "bottom-right",
      offset: "20px",
      width: "50px",
      height: "50px",
      idle: {
        color: "#2563eb",
        type: "pill",
        title: "Talk to Val",
        subtitle: "Click to chat",
        icon: "https://unpkg.com/lucide-static/icons/mic.svg"
      },
      loading: {
        color: "#3b82f6"
      },
      active: {
        color: "#ef4444",
        type: "pill",
        title: "Listening...",
        subtitle: "Say something"
      }
    }
  });
</script>

</body>
</html>
